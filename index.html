<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="start-screen screen">
        <h1>Survive, collect food, and evolve!</h1>
        <p>Press the ↑ key to jump.</p>
        <button class="start-btn">Start Game</button>
    </div>
    <div class = "game-screen screen">
        <div class ="hud">
        <span class = "life">"life: "</span>
        <span class = "score">"score: "</span>
        </div>
    </div>
    <div class="end-screen screen">
        <div class = "end-content">
       <h1>GAME OVER!!</h1>
       <p>Your evolutionary journey has ended.</p>
       <button class="retry-btn">Try Again</button>
       </div>
    </div>
   <script src="js/foods.js" defer></script>
   <script src="js/obstacle.js" defer></script>
   <script src="js/player.js" defer></script>
   <script src="js/ground.js" defer></script>
   <script src="js/game.js" defer></script>
   <script src="js/index.js" defer></script>
</body>
</html>
